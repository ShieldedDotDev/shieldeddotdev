on: [push, pull_request]
name: CI
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Install Dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Build
        run: make clean release

      - name: Check generated assets are clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- static pages)" ]; then
            git status --short -- static pages
            git diff -- static pages
            echo "::error::Generated assets have uncommitted changes after build"
            exit 1
          fi

      - name: Test
        run: go test ./...
